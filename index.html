<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
'use strict';
const UNITS=['UIA','UIA2','UIA3','UIA4','UIA5'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let auth,db,profile=null,activeUnit='',structure=null,rows={},busy=false,stream=null,scanner=null,scanSession=0,loadSequence=0;
const now=()=>new Date().toISOString();const date=s=>s?new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Data não registrada';
function permitted(unit){return profile?.active===true&&profile.units?.[unit]===true}function admin(){return profile?.role==='admin'}
function path(name,unit=activeUnit){if(!UNITS.includes(unit)||!permitted(unit))throw Error('Unidade sem liberação.');return 'wms_units/'+unit+'/'+name}
function defaults(unit){return {unit,blocks:[{code:'A',count:10,height:4,depth:4,type:'papelao',positions:{}},{code:'B',count:10,height:4,depth:4,type:'embalagem',positions:{}}]}}
function config(loc,s=structure){const m=/^([A-Z]{1,3})-(\d+)$/.exec(loc),b=m&&s?.blocks.find(x=>x.code===m[1]);return b&&+m[2]>=1&&+m[2]<=b.count?{...b,...b.positions?.[+m[2]]}:null}
function locations(){return structure.blocks.flatMap(b=>Array.from({length:b.count},(_,n)=>b.code+'-'+String(n+1).padStart(2,'0')))}
function slots(loc){return (rows[loc]?.slots||[]).filter(Boolean)}
function equal(a,b){return JSON.stringify(canonical(a))===JSON.stringify(canonical(b))}function canonical(x){if(Array.isArray(x))return x.map(canonical);if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])]));return x}
async function read(name,unit=activeUnit){return (await db.ref(path(name,unit)).once('value')).val()}
async function cas(name,expected,value,unit=activeUnit){const target=path(name,unit),token=await auth.currentUser.getIdToken(),url=window.WMS_FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+'/'+target+'.json?auth='+encodeURIComponent(token);const r=await fetch(url,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});if(!r.ok)throw Error('Falha ao consultar os dados (HTTP '+r.status+').');const fresh=await r.json();if(!equal(fresh,expected))throw Error('Outro usuário alterou os dados. Atualize e confira antes de salvar.');const tag=r.headers.get('ETag');if(!tag)throw Error('Não foi possível confirmar a versão dos dados.');const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','if-match':tag},body:JSON.stringify(value)});if(w.status===412)throw Error('Outro usuário alterou os dados. Atualize e confira antes de salvar.');if(!w.ok)throw Error('Falha ao salvar (HTTP '+w.status+').');}
async function history(loc,action,before,after,unit){await db.ref(path('wms_history/'+loc,unit)).push({action,createdAt:now(),actorUid:auth.currentUser.uid,before,after})}
function notice(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':'success'}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){notice(e.message,true);alert(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function close(){if(busy)return;stopCamera();$('modal').close()}
function show(title,body){stopCamera();$('modalTitle').textContent=title;$('modalBody').innerHTML=body;if(!$('modal').open)$('modal').showModal()}
async function load(){const unit=activeUnit,seq=++loadSequence;notice('Carregando '+unit+'...');const [s,r]=await Promise.all([read('wms_structure',unit),read('wms',unit)]);if(unit!==activeUnit||seq!==loadSequence)return;structure=s||defaults(unit);rows=r||{};render();notice('Mapa atualizado • '+unit)}
function render(){if(!structure)return;const q=$('search').value.trim().toLowerCase();let total=0,occupied=0;const oldest=new Map();for(const row of Object.values(rows))for(const s of row?.slots||[]){if(!s?.palletizedAt)continue;const k=s.itemCode||s.palletBar;if(!oldest.has(k)||s.palletizedAt<oldest.get(k))oldest.set(k,s.palletizedAt)}$('map').innerHTML=structure.blocks.map(b=>'<div class="card"><h2>Bloco '+esc(b.code)+'</h2><div class="grid">'+Array.from({length:b.count},(_,n)=>{const loc=b.code+'-'+String(n+1).padStart(2,'0'),ss=slots(loc),c=config(loc),hit=q&&(loc.toLowerCase().includes(q)||ss.some(s=>[s.palletBar,s.itemCode].some(v=>String(v||'').toLowerCase().includes(q))));total+=ss.length;if(ss.length)occupied++;const old=ss.some(s=>s.palletizedAt&&oldest.get(s.itemCode||s.palletBar)===s.palletizedAt);return '<button class="place '+(ss.length?'used ':'')+(hit?'hit':'')+'" data-loc="'+loc+'"><b>'+loc+'</b><br>'+ss.length+'/'+c.height*c.depth+' paletes<br><small>'+ (c.type==='papelao'?'Papelão':'Embalagens')+'</small>'+(old?'<br><small class="oldest">Palete mais antigo do item</small>':'')+'</button>'}).join('')+'</div></div>').join('');$('summary').textContent=activeUnit+' • '+total+' paletes • '+occupied+' posições ocupadas • '+(locations().length-occupied)+' livres';$('map').querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>openLocation(b.dataset.loc))}
function group(ss){const result=new Map();for(const s of ss){const k=JSON.stringify([s.palletBar,s.itemCode]);if(!result.has(k))result.set(k,{palletBar:s.palletBar,itemCode:s.itemCode,slots:[]});result.get(k).slots.push(s)}return [...result.values()]}
function openLocation(loc){const c=config(loc),before=rows[loc]||null,unit=activeUnit;const groups=group(slots(loc));show(unit+' • '+loc+' • '+(c.type==='papelao'?'Papelão':'Embalagens'),'<div id="loads">'+(groups.map(g=>'<div class="load"><b>Barra '+esc(g.palletBar)+'</b> • Item '+esc(g.itemCode)+'<br>'+g.slots.length+' palete(s) • '+[...new Set(g.slots.map(s=>'H'+s.height))].join(', ')+'<small>Entrada: '+date(g.slots.map(s=>s.palletizedAt).filter(Boolean).sort()[0])+'</small><button data-bar="'+esc(g.palletBar)+'">Baixa parcial / completa</button></div>').join('')||'<p>Posição vazia.</p>')+'</div><div class="card"><h3>Adicionar barra</h3><label>Barra do palete</label><input id="newBar"><label>Código do item</label><input id="newItem"><div class="row"><div><label>Altura inicial</label><select id="newH">'+Array.from({length:c.height},(_,i)=>'<option value="'+(i+1)+'">H'+(i+1)+'</option>').join('')+'</select></div><div><label>Quantidade de paletes</label><input id="newQty" type="number" min="1" max="'+c.height*c.depth+'" value="1"></div></div><button id="add" class="primary" style="margin-top:12px">Salvar entrada</button></div><button id="hist">Consultar histórico</button><div id="history"></div>');$('loads').querySelectorAll('[data-bar]').forEach(b=>b.onclick=()=>withdrawDialog(b.dataset.bar,loc));$('add').onclick=()=>run(async()=>{const bar=$('newBar').value.trim(),item=$('newItem').value.trim(),h=+$('newH').value,qty=+$('newQty').value;if(!bar||!item||!Number.isInteger(qty)||qty<1)throw Error('Informe barra, item e uma quantidade inteira positiva.');const ss=[...(before?.slots||[])],used=new Set(ss.map(s=>s.height+'-'+s.depth));if(Array.from({length:c.depth},(_,i)=>h+'-'+(i+1)).every(k=>used.has(k)))throw Error('A altura selecionada está cheia. Selecione uma altura livre.');let remaining=qty;const timestamp=now();for(let hh=h;hh<=c.height&&remaining;hh++)for(let d=1;d<=c.depth&&remaining;d++)if(!used.has(hh+'-'+d)){ss.push({height:hh,depth:d,palletBar:bar,itemCode:item,palletizedAt:timestamp});remaining--}if(remaining)throw Error('Não há espaço suficiente a partir da altura escolhida.');await savePosition(loc,before,ss,'entrada',unit);$('modal').close()});$('hist').onclick=async()=>{try{const v=(await db.ref(path('wms_history/'+loc,unit)).orderByKey().limitToLast(20).once('value')).val();$('history').innerHTML=Object.values(v||{}).reverse().map(r=>'<div class="history">'+date(r.createdAt)+' • '+esc(r.action)+' • '+(r.before||[]).length+' → '+(r.after||[]).length+' paletes</div>').join('')||'<p>Sem histórico.</p>'}catch(e){$('history').textContent=e.message}}}
async function savePosition(loc,before,ss,action,unit){const c=config(loc);if(ss.some(s=>s.height<1||s.height>c.height||s.depth<1||s.depth>c.depth))throw Error('Endereço fora da configuração.');const value={location:loc,slots:ss.sort((a,b)=>a.height-b.height||a.depth-b.depth),updatedAt:now()};await cas('wms/'+loc,before,value,unit);if(unit===activeUnit){rows[loc]=value;render()}try{await history(loc,action,before?.slots||[],ss,unit);notice('Movimentação salva • '+unit)}catch(e){notice('Movimentação salva, mas o histórico não foi gravado. Não repita a entrada ou baixa.',true)}}
function withdrawDialog(bar,onlyLoc){const candidates=Object.keys(rows).filter(loc=>(!onlyLoc||loc===onlyLoc)&&slots(loc).some(s=>s.palletBar===bar));if(!candidates.length)return alert('Barra não encontrada nesta unidade.');show('Baixa • '+bar,'<p>Confira a posição e a quantidade antes de confirmar.</p><label>Posição</label><select id="removeLoc">'+candidates.map(loc=>'<option>'+loc+'</option>').join('')+'</select><p id="available"></p><label>Quantidade a retirar</label><input id="removeQty" type="number" min="1" value="1"><button id="removeConfirm" class="danger" style="margin-top:14px">Confirmar retirada</button>');const update=()=>{$('available').textContent=slots($('removeLoc').value).filter(s=>s.palletBar===bar).length+' paletes disponíveis';};$('removeLoc').onchange=update;update();$('removeConfirm').onclick=()=>run(async()=>{const loc=$('removeLoc').value,before=rows[loc]||null,unit=activeUnit,qty=+$('removeQty').value,found=slots(loc).filter(s=>s.palletBar===bar).sort((a,b)=>a.height-b.height||a.depth-b.depth);if(!Number.isInteger(qty)||qty<1||qty>found.length)throw Error('Quantidade inválida para o saldo da barra.');const remove=new Set(found.slice(0,qty).map(s=>s.height+'-'+s.depth)),kept=slots(loc).filter(s=>!remove.has(s.height+'-'+s.depth));const counters=new Map();kept.sort((a,b)=>a.height-b.height||a.depth-b.depth);const compact=kept.map(s=>{const d=(counters.get(s.height)||0)+1;counters.set(s.height,d);return {...s,depth:d}});await savePosition(loc,before,compact,'retirada',unit);$('modal').close()})}
function validateStructure(next){if(!Array.isArray(next.blocks)||!next.blocks.length)throw Error('Cadastre pelo menos um bloco.');const codes=new Set();for(const b of next.blocks){if(!/^[A-Z]{1,3}$/.test(b.code)||codes.has(b.code))throw Error('Código de bloco inválido ou repetido.');codes.add(b.code);if(!Number.isInteger(b.count)||b.count<1||b.count>200)throw Error('Use 1 a 200 posições.');for(const p of [b,...Object.values(b.positions||{}).filter(Boolean)])if(!Number.isInteger(p.height)||p.height<1||p.height>50||!Number.isInteger(p.depth)||p.depth<1||p.depth>50||!['papelao','embalagem'].includes(p.type))throw Error('Use alturas e profundidades entre 1 e 50.');}for(const [loc,row] of Object.entries(rows))for(const s of row?.slots||[]){const p=config(loc,next),old=config(loc);if(!p||s.height>p.height||s.depth>p.depth||p.type!==old?.type)throw Error('Realocar / esvaziar '+loc+' antes de reduzir o espaço ou mudar o material.');}}
function configure(){if(!admin())return;const draft=JSON.parse(JSON.stringify(structure)),unit=activeUnit;const renderConfig=()=>{show('Configuração • '+unit,'<p>Cada posição pode ter altura, profundidade e material próprios.</p><div id="blocks">'+draft.blocks.map((b,i)=>'<div class="card"><div class="row"><div><label>Bloco</label><input data-i="'+i+'" data-key="code" value="'+esc(b.code)+'"></div><div><label>Posições</label><input type="number" min="1" max="200" data-i="'+i+'" data-key="count" value="'+b.count+'"></div><div><label>Alturas padrão</label><input type="number" data-i="'+i+'" data-key="height" value="'+b.height+'"></div><div><label>Profundidades padrão</label><input type="number" data-i="'+i+'" data-key="depth" value="'+b.depth+'"></div></div><label>Material padrão</label><select data-i="'+i+'" data-key="type"><option value="papelao" '+(b.type==='papelao'?'selected':'')+'>Papelão</option><option value="embalagem" '+(b.type==='embalagem'?'selected':'')+'>Embalagens</option></select><details><summary style="margin:14px 0">Configurar posições individualmente</summary><div class="grid">'+Array.from({length:b.count},(_,n)=>{const p=b.positions?.[n+1];return '<div class="positionconfig"><b>'+esc(b.code)+'-'+String(n+1).padStart(2,'0')+'</b><label><input style="width:auto" type="checkbox" data-override="'+i+','+(n+1)+'" '+(p?'checked':'')+'> Própria</label>'+(p?'<label>Alturas</label><input type="number" data-position="'+i+','+(n+1)+',height" value="'+p.height+'"><label>Profundidades</label><input type="number" data-position="'+i+','+(n+1)+',depth" value="'+p.depth+'"><label>Material</label><select data-position="'+i+','+(n+1)+',type"><option value="papelao" '+(p.type==='papelao'?'selected':'')+'>Papelão</option><option value="embalagem" '+(p.type==='embalagem'?'selected':'')+'>Embalagens</option></select>':'')+'</div>'}).join('')+'</div></details><button data-delete="'+i+'" class="danger">Remover bloco</button></div>').join('')+'</div><div class="row"><button id="addBlock">Adicionar bloco</button><button id="saveConfig" class="primary">Salvar configuração</button></div>');$('blocks').querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{draft.blocks[+el.dataset.i][el.dataset.key]=['code','type'].includes(el.dataset.key)?el.value.trim().toUpperCase().replace(/^PAPELAO$/,'papelao').replace(/^EMBALAGEM$/,'embalagem'):+el.value;if(el.dataset.key==='count'){draft.blocks[+el.dataset.i].count=Math.min(200,Math.max(1,+el.value||1));renderConfig()}});$('blocks').querySelectorAll('[data-override]').forEach(el=>el.onchange=()=>{const [i,n]=el.dataset.override.split(',').map(Number),b=draft.blocks[i];b.positions=b.positions||{};if(el.checked)b.positions[n]={height:b.height,depth:b.depth,type:b.type};else delete b.positions[n];renderConfig()});$('blocks').querySelectorAll('[data-position]').forEach(el=>el.onchange=()=>{const [i,n,k]=el.dataset.position.split(',');draft.blocks[i].positions[n][k]=k==='type'?el.value:+el.value});$('blocks').querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{draft.blocks.splice(+el.dataset.delete,1);renderConfig()});$('addBlock').onclick=()=>{const code='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(c=>!draft.blocks.some(b=>b.code===c));if(!code)return alert('Limite de blocos atingido.');draft.blocks.push({code,count:1,height:4,depth:4,type:'embalagem',positions:{}});renderConfig()};$('saveConfig').onclick=()=>run(async()=>{const expected=await read('wms_structure',unit);if(!equal(expected||defaults(unit),structure))throw Error('A configuração foi alterada. Atualize o mapa.');rows=await read('wms',unit)||{};validateStructure(draft);draft.unit=unit;for(const b of draft.blocks)for(const n of Object.keys(b.positions||{}))if(+n>b.count)delete b.positions[n];await cas('wms_structure',expected,draft,unit);structure=draft;render();notice('Configuração salva • '+unit);$('modal').close()})};renderConfig()}
function stopCamera(){scanSession++;if(scanner){try{scanner.stop()}catch(e){}scanner=null}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
async function camera(mode){if(busy)return;show('Ler barra • '+activeUnit,'<video id="video" autoplay muted playsinline></video><p id="cameraMsg">Abrindo câmera...</p><div id="scanResult"></div>');const session=scanSession;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Câmera indisponível. Use HTTPS ou digite a barra.');const capture=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(session!==scanSession){capture.getTracks().forEach(t=>t.stop());return}stream=capture;$('video').srcObject=stream;await $('video').play();if(!window.ZXingBrowser){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Não foi possível carregar o leitor. Digite a barra.'));document.head.appendChild(script)})}if(session!==scanSession)return;const reader=new ZXingBrowser.BrowserMultiFormatReader();scanner=await reader.decodeFromStream(stream,$('video'),(result,error,controls)=>{if(!result||session!==scanSession)return;const bar=result.getText();controls.stop();stopCamera();$('cameraMsg').textContent='Confira a barra lida:';$('scanResult').innerHTML='<input id="scanned" readonly><button id="useScan" class="primary" style="margin-top:12px">'+(mode==='search'?'Pesquisar':'Continuar baixa')+'</button>';$('scanned').value=bar;$('useScan').onclick=()=>{close();if(mode==='search'){$('search').value=bar;render()}else{$('withdrawBar').value=bar;withdrawDialog(bar)}}});if(session!==scanSession){scanner?.stop();scanner=null}}catch(e){if(session===scanSession)$('cameraMsg').textContent=e.message}}
$('closeModal').onclick=close;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});$('modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();else stopCamera()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera()});window.addEventListener('pagehide',stopCamera);
$('search').oninput=render;$('withdrawStart').onclick=()=>withdrawDialog($('withdrawBar').value.trim());$('reload').onclick=()=>run(load);$('configure').onclick=configure;$('cameraSearch').onclick=()=>camera('search');$('cameraWithdraw').onclick=()=>camera('withdraw');$('unit').onchange=()=>{if(busy){$('unit').value=activeUnit;return}stopCamera();$('modal').close();activeUnit=$('unit').value;rows={};structure=null;$('map').innerHTML='';$('search').value='';$('withdrawBar').value='';load().catch(e=>notice(e.message,true))};
$('exit').onclick=()=>auth.signOut();$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';const btn=e.target.querySelector('button');btn.disabled=true;try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value=''}catch(err){$('loginMsg').textContent='Não foi possível entrar. Confira e-mail, senha e a configuração do Firebase.'}finally{btn.disabled=false}};
try{const cfg=window.WMS_FIREBASE_CONFIG;if(!cfg?.apiKey||cfg.apiKey==='PREENCHER')throw Error('Piloto ainda não ativado. Configure o projeto Firebase próprio conforme LEIA-ME.');firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(async user=>{stopCamera();$('modal').close();profile=null;rows={};structure=null;$('app').hidden=true;$('login').hidden=false;$('exit').hidden=true;$('identity').textContent='';if(!user)return;try{const p=(await db.ref('wms_access/'+user.uid).once('value')).val();if(!p||p.active!==true)throw Error('Usuário sem liberação. Solicite o cadastro ao administrador.');profile=p;const allowed=UNITS.filter(permitted);if(!allowed.length)throw Error('Nenhuma unidade liberada.');activeUnit=allowed[0];$('unit').innerHTML=allowed.map(u=>'<option>'+u+'</option>').join('');$('unit').disabled=allowed.length===1;$('configure').hidden=!admin();$('identity').textContent=(p.name||user.email)+' • '+(admin()?'Administrador WMS':'Operador WMS');$('exit').hidden=false;$('login').hidden=true;$('app').hidden=false;await load()}catch(e){$('loginMsg').textContent=e.message;$('exit').hidden=false;}})}catch(e){$('loginMsg').textContent=e.message;$('loginForm').querySelector('button').disabled=true}
